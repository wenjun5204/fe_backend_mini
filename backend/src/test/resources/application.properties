# 测试专属配置:H2 内存库(每次测试干净启动,不污染 ./data 文件库)
spring.datasource.url=jdbc:h2:mem:quanjiafu-test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

server.port=0

# 鉴权模式(测试形态):dev code 回退必须显式开启——本文件整体遮蔽主配置,漏写则登录走 code2Session 而 mock 不存在,204 条用例全挂
auth.dev-code-enabled=true
auth.trust-wx-header=false
