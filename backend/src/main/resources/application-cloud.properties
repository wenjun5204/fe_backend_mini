# 微信云托管部署 profile(Dockerfile ENTRYPOINT 激活:--spring.profiles.active=cloud)
# 鉴权形态:信任平台注入的 X-WX-OPENID 头(前提:服务不得开启公网访问路径,否则头可被伪造——架构红线)
# 同环境 MySQL 由平台注入:MYSQL_ADDRESS(host:port,由 CloudEnvPostProcessor 拆分为 MYSQL_HOST/MYSQL_PORT)
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:quanjiafu}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${MYSQL_USERNAME}
spring.datasource.password=${MYSQL_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# 生产关闭 API 文档暴露(live-check 仅在内网/本地使用)
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# 健康探针:云托管 liveness/readiness 指向 /actuator/health(含 DB 连通性检测)
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# ---- 鉴权模式覆盖(云托管形态):信任注入头,禁 dev-code;token-secret 默认空=legacy 明文(存量零影响) ----
auth.trust-wx-header=true
auth.dev-code-enabled=false
auth.token-secret=${AUTH_TOKEN_SECRET:}
