# 自部署服务器 profile(docker-compose 指定 SPRING_PROFILES_ACTIVE=selfdeploy;Dockerfile 默认仍为 cloud)
# 数据层与 cloud 同构:MYSQL_ADDRESS(host:port)由 CloudEnvPostProcessor 拆分注入(处理器不分 profile,均可复用)
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:quanjiafu}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${MYSQL_USERNAME}
spring.datasource.password=${MYSQL_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# 生产关闭 API 文档暴露
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# 健康探针:负载均衡/监控指向 /actuator/health(含 DB 连通性检测)
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# ---- 鉴权模式(自部署形态,安全默认写死在文件层) ----
# 公网部署:X-WX-OPENID 头可被任意客户端伪造,一律不信任;身份只能来自 code → code2Session
auth.trust-wx-header=false
auth.dev-code-enabled=false
# token HMAC 签名密钥:必填(空=启动即死,AuthModeGuard fail-fast——明文 userId token 在公网可被遍历冒充)
auth.token-secret=${AUTH_TOKEN_SECRET:}
# 微信小程序配置:code2Session 必需,必填(缺失启动即死)
wx.appid=${WX_APP_ID:}
wx.secret=${WX_APP_SECRET:}
wx.api-base-url=${WX_API_BASE_URL:https://api.weixin.qq.com}
