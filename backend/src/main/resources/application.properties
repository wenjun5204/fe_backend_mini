spring.application.name=backend

# ---- 端口:云托管要求 80,本地默认 8080(Dockerfile 设置 ENV PORT=80) ----
server.port=${PORT:8080}

# ---- 本地开发默认数据源:H2 文件模式(云托管部署走 cloud profile + MySQL) ----
spring.datasource.url=jdbc:h2:file:./data/quanjiafu;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# ---- v1.5 订阅消息:仅额度账本(真实微信 API 发送不在范围);模板 ID 开发期占位,联调开关 ----
notify.enabled=false
notify.templates.draw-reminder=DRAW_REMINDER_TEMPLATE_PLACEHOLDER

# ---- v2.1 感恩信 AI 网关(Java 21 内置 HttpClient,零第三方 SDK;Key 缺省=AI 关闭,全走 FALLBACK 降级) ----
ai.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}
ai.api-key=${OPENAI_API_KEY:}
ai.model=${HARNESS_LLM_MODEL:gpt-4o-mini}

# ---- 鉴权模式(双部署形态;信任边界由 profile 决定,见 application-cloud/selfdeploy.properties) ----
# 信任 X-WX-OPENID 头:仅 cloud profile(云托管平台注入+无公网路径)开启;自部署/本地一律 false(公网可伪造)
auth.trust-wx-header=false
# 开发态回退(code 即 openid):本地/集成测试用;cloud/selfdeploy profile 关闭(生产绝不能开)
auth.dev-code-enabled=true
# token 签名密钥:空=legacy 明文 userId token(存量部署零影响);selfdeploy 必填(AuthModeGuard fail-fast)
auth.token-secret=${AUTH_TOKEN_SECRET:}

# ---- 微信小程序配置(自部署 code2Session 链路用;云托管链路不需要) ----
wx.appid=${WX_APP_ID:}
wx.secret=${WX_APP_SECRET:}
# 测试可指向本地桩(WeChatCode2SessionClientTest),生产恒为微信官方
wx.api-base-url=${WX_API_BASE_URL:https://api.weixin.qq.com}
