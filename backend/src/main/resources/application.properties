spring.application.name=backend

# ---- 端口:云托管要求 80,本地默认 8080(Dockerfile 设置 ENV PORT=80) ----
server.port=${PORT:8080}

# ---- 本地开发默认数据源:H2 文件模式(云托管部署走 cloud profile + MySQL) ----
spring.datasource.url=jdbc:h2:file:./data/quanjiafu;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# ---- v1.5 订阅消息:仅额度账本(真实微信 API 发送不在范围);模板 ID 开发期占位,联调开关 ----
notify.enabled=false
notify.templates.draw-reminder=DRAW_REMINDER_TEMPLATE_PLACEHOLDER
