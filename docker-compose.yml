services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-quanjiafu}
      MYSQL_USER: ${MYSQL_USERNAME:-quanjiafu}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PORT: ${APP_PORT:-8080}
      TZ: ${TZ:-Asia/Shanghai}
      # 默认 selfdeploy(自部署形态:code2Session 鉴权 + HMAC token + 不信任 X-WX-OPENID);
      # 连微信云托管容器部署则不需要 compose(云托管控制台构建,profile 由 Dockerfile 默认 cloud)
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-selfdeploy}
      MYSQL_ADDRESS: ${MYSQL_ADDRESS:-mysql:3306}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-quanjiafu}
      MYSQL_USERNAME: ${MYSQL_USERNAME:-quanjiafu}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      # selfdeploy 三要素(AuthModeGuard fail-fast,缺失启动即死)
      WX_APP_ID: ${WX_APP_ID:?Set WX_APP_ID in .env}
      WX_APP_SECRET: ${WX_APP_SECRET:?Set WX_APP_SECRET in .env}
      AUTH_TOKEN_SECRET: ${AUTH_TOKEN_SECRET:?Set AUTH_TOKEN_SECRET in .env}
      JAVA_OPTS: ${JAVA_OPTS:--XX:MaxRAMPercentage=75.0}
    ports:
      - "${APP_PORT:-8080}:${APP_PORT:-8080}"

  # HTTPS 终结(小程序 wx.request 强制 https+已备案域名);证书就绪后取消注释
  # nginx:
  #   image: nginx:alpine
  #   restart: unless-stopped
  #   depends_on: [backend]
  #   ports: ["80:80", "443:443"]
  #   volumes:
  #     - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
  #     - ./deploy/certs:/etc/nginx/certs:ro

volumes:
  mysql-data:
