openapi: 3.0.3
info:
  title: 全家福·接福气 API
  version: 1.9.1
  description: |
    家庭互动小程序「全家福·接福气」接口契约(唯一事实源)。
    v1.5.0 增量:八卦集福阵(只读进度)/转罗盘卦位(仅卡面主题)/解忧册文案下发(幂等)/订阅消息授权登记。
    v1.6.0 增量(念家时 v2.0 日子管家):日子记录(生日/纪念日/在一起)CRUD、按人提醒配置、到期计算;复用既有 /api/calendar/convert 与 /api/notify/*。
    v1.7.0 增量(念家时 v2.1 模板馆引擎):模板馆清单(服务端配置驱动)、感恩信 AI 生成(逐句备选)、三类卡片定稿存档/详情/删除/分享场景码、时光胶囊封存/开箱、免鉴权访客落地/点亮心/解锁内容(/api/visitor/* 不要求登录 token)。
    v1.8.0 增量(念家时 v2.2 家人空间):节日/上线预约登记与到期清单(/api/festivals/*)、照片上传与免鉴权回显(base64 JSON 解码后 ≤500KB,/api/photos/*)、家人瞬间时间线与真好/收藏互动(/api/moments/* 与 /api/days/{id}/moments 素材池);既有授权扩展:CardKind +BIRTHDAY_CARD(生日福卡,随时可生成,生日当天由提醒自然触达)、DayRecord +year 与周年称谓计算字段、时光胶囊 +photoId、访客端 BIRTHDAY_CARD 体面内容形态。
    v1.9.0 增量(念家时 v2.3 值班日历):个人视角值班记录与提醒(/api/duty/*)——月历班次查询、今日状态卡(今日班次+60 天下次值班扫描)、单日设置/清除、周期规则批量排班(5 预设,>365 天截断,覆盖已有排班)、提醒时机配置(advance_1d/same_day_08/advance_2h);提醒只存配置+订阅授权登记(复用既有 /api/notify/subscribe),真实推送下发属部署联调阶段。
    v1.9.1 增量(值班分享 P1):值班表分享场景码签发(幂等,存 UserEntity.dutyShareScene)与免鉴权只读月历(/api/duty/shared/{scene}——8 位 base62 高熵不可枚举,不要求登录 token;仅返回月份+日期×班次映射+分享者昵称,不含 userId/openid 等敏感字段)。
    合规约束:文案禁用迷信词(见 .agents/docs/conventions.md,含 v1.5 追加:卦象/卦运/宜忌/生门/吉位/凶位/能成/不行/会有/注定/天意/预示/破财/有灾),错误 message 面向用户须过合规词表。
tags:
  - name: days
    description: 念家时 v2.0 日子管家(生日/纪念日/在一起三类日子,自由关系文本,按人提醒配置与到期计算)
  - name: cards
    description: 念家时 v2.1 模板馆引擎——模板清单、感恩信 AI 生成与三类卡片(LETTER/DAYS_CARD/CAPSULE)定稿存档、分享场景码签发
  - name: capsules
    description: 念家时 v2.1 时光胶囊——封存/列表/详情(内容门控)/到期开箱(幂等)
  - name: visitor
    description: 念家时 v2.1 免鉴权访客组(/api/visitor/*)——扫码落地/点亮心(42900 软频控)/解锁取隐藏内容;不要求登录 token,永不返回 40100
  - name: festival
    description: 念家时 v2.2 节日与上线预约(/api/festivals/*)——「上线提醒我」与节日提醒共用登记(幂等)、我的预约清单、0-7 天窗口到期清单(首页节日横幅/节点倒计时数据源)
  - name: photos
    description: 念家时 v2.2 照片管道(/api/photos/*)——base64 JSON 上传(解码后 ≤500KB,每日每人 ≤20 张)与免鉴权回显(photoId 高熵 capability URL,<image> 直挂;不要求登录 token)
  - name: moments
    description: 念家时 v2.2 家人瞬间(/api/moments/*)——照片+一句话家族时间线、真好(点赞,限 1 次)、收藏进日子(生日福卡素材池,含 /api/days/{id}/moments)
  - name: duty
    description: 念家时 v2.3 值班日历(/api/duty/*)——个人视角值班记录与提醒:月历班次、今日状态卡(下次值班 60 天扫描)、单日设置/清除、周期规则批量排班、提醒时机配置(真实推送下发属部署联调阶段,本组仅数据与配置);v1.9.1 增值班分享场景码与免鉴权只读月历(/api/duty/shared/*,AuthInterceptor 排除)
paths:
  /api/auth/login:
    post:
      operationId: login
      summary: 微信登录(MVP 用 code 换取用户身份,返回 token)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
  /api/family:
    get:
      operationId: getMyFamily
      summary: 我的家(家族详情+成员今日状态墙)
      responses:
        '200':
          description: 家族详情;未加入家族时返回 notJoined=true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FamilyDetail'
    post:
      operationId: createFamily
      summary: 创建家族(每人限 1 个,创建者即户主)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFamilyRequest'
      responses:
        '200':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FamilyDetail'
  /api/family/join:
    post:
      operationId: joinFamily
      summary: 通过邀请码加入家族(上限 8 人,每人限加入 1 个)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JoinFamilyRequest'
      responses:
        '200':
          description: 加入成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FamilyDetail'
  /api/fortune/today:
    get:
      operationId: getTodayFortune
      summary: 今日福签(含我的抽签/分享/任务状态)
      responses:
        '200':
          description: 今日福签
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FortuneTodayResponse'
  /api/fortune/draw:
    post:
      operationId: drawFortune
      summary: 抽取今日福签(每家族每日同签,每人每日 1 次)
      responses:
        '200':
          description: 抽签成功,返回福签与最新福值
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FortuneDrawResponse'
  /api/fortune/share:
    post:
      operationId: shareFortune
      summary: 标记福签已转发(软引导奖励,+10 福值,每日 1 次)
      responses:
        '200':
          description: 分享奖励发放
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlessResult'
  /api/fortune/task-done:
    post:
      operationId: completeFortuneTask
      summary: 完成今日宜事项(+15 福值,每日 1 次;v1.5 增加可选事项文本用于八卦阵任务型进度统计)
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FortuneTaskDoneRequest'
      responses:
        '200':
          description: 任务奖励发放
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlessResult'
  /api/interact/tianfu:
    post:
      operationId: tianfu
      summary: 给家人添福(+8,每人每天对每位家人 1 次)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TargetUserRequest'
      responses:
        '200':
          description: 添福成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlessResult'
  /api/interact/cuifu:
    post:
      operationId: cuifu
      summary: 催福(提醒未接福的家人,对同一人每日≤3 次)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TargetUserRequest'
      responses:
        '200':
          description: 催福已送达
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CuifuResult'
  /api/rank/family:
    get:
      operationId: getFamilyRank
      summary: 家内榜(本周成员福值排名)
      responses:
        '200':
          description: 家内榜
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FamilyRankResponse'
  /api/rank/friends:
    get:
      operationId: getFriendFamilyRank
      summary: 好友家族榜(好友关系内家族福值对比,MVP 互关家族模拟)
      responses:
        '200':
          description: 好友家族榜
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FriendRankResponse'
  /api/invite/info:
    get:
      operationId: getInviteInfo
      summary: 邀请卡片信息(分享落地页,未登录可用)
      parameters:
        - name: inviteCode
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 邀请信息
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InviteInfo'
  /api/calendar/convert:
    post:
      operationId: convertCalendar
      summary: 公历农历日期换算(只计算不保存)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CalendarConvertRequest'
      responses:
        '200':
          description: 日期换算结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalendarConvertResponse'
  /api/birthdays:
    get:
      operationId: getBirthdays
      summary: 获取本人可见的家庭生日簿(按下一次生日由近到远)
      responses:
        '200':
          description: 生日簿列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BirthdayListResponse'
    post:
      operationId: createBirthday
      summary: 新增一条家人或亲友生日记录
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BirthdayUpsertRequest'
      responses:
        '200':
          description: 已保存的生日记录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BirthdayRecord'
  /api/birthdays/upcoming:
    get:
      operationId: getUpcomingBirthday
      summary: 获取最近一位本人可见的生日(供我的家卡片使用)
      responses:
        '200':
          description: 近期生日;没有记录时 upcoming 为 null
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpcomingBirthdayResponse'
  /api/birthdays/{id}:
    put:
      operationId: updateBirthday
      summary: 编辑一条生日记录(录入人或户主可编辑家庭共享记录)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BirthdayUpsertRequest'
      responses:
        '200':
          description: 已更新的生日记录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BirthdayRecord'
    delete:
      operationId: deleteBirthday
      summary: 删除生日记录及当前用户的关联提醒
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 删除结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteBirthdayResponse'
  /api/birthdays/{id}/reminder:
    put:
      operationId: updateBirthdayReminder
      summary: 设置当前用户的生日提醒时点(默认关闭)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BirthdayReminderRequest'
      responses:
        '200':
          description: 当前用户的提醒设置
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BirthdayReminder'
  /api/bagua/status:
    get:
      operationId: getBaguaStatus
      summary: 家族八卦集福阵进度(8 卦,服务端推导,只读;无任何客户端写入接口)
      responses:
        '200':
          description: 八卦阵进度
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaguaStatusResponse'
  /api/bagua/celebrate:
    post:
      operationId: celebrateBaguaComplete
      summary: 八卦圆满庆祝标记(一次性,幂等;前端圆满庆祝动效结束后调用)
      responses:
        '200':
          description: 标记结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaguaCelebrateResponse'
  /api/me/pendant:
    post:
      operationId: wearPendant
      summary: 佩戴头像挂件(达标解锁制:解锁条件由服务端从既有数据校验,未达标返回 40900;不消耗福值)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PendantWearRequest'
      responses:
        '200':
          description: 佩戴成功,返回当前佩戴
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PendantWearResponse'
  /api/jieyou/quote:
    get:
      operationId: getJieyouQuote
      summary: 解忧册当日宽心话(每人每日一翻,服务端幂等:同日重复请求返回同条;纯随机,不采集问题内容)
      responses:
        '200':
          description: 当日宽心话
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JieyouQuoteResponse'
  /api/notify/subscribe:
    post:
      operationId: registerNotifySubscription
      summary: 登记订阅消息授权(抽卡成功后嵌入的正向时刻授权;拒绝不影响任何功能,静默降级)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotifySubscribeRequest'
      responses:
        '200':
          description: 登记结果与剩余可发送额度
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotifySubscribeResponse'
  /api/notify/status:
    get:
      operationId: getNotifyStatus
      summary: 查询订阅授权状态与剩余额度(设置页「提醒」分组展示,频率透明)
      responses:
        '200':
          description: 订阅状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotifyStatusResponse'
  /api/days:
    get:
      tags: [days]
      operationId: listDays
      summary: 日子列表(本人创建的全部+同家族他人 visibility=FAMILY;服务端排序:非 TOGETHER 按 daysUntil 升序,TOGETHER 固定底部)
      responses:
        '200':
          description: 已排序的日子列表;空数组触发前端空状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DayListResponse'
        '401':
          description: 未登录或身份失效(40100)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags: [days]
      operationId: createDay
      summary: 记一个日子(kind=TOGETHER 时 calendarType 固定 SOLAR 且 month/day 可省,服务端取当天为起始日)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DayUpsertRequest'
      responses:
        '200':
          description: 已保存的日子记录(含计算字段)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DayRecord'
        '400':
          description: 参数错误(40000:month/day 越界、kind/calendarType/reminders 非法、TOGETHER 传 LUNAR、字段缺失、year 越界)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未登录或身份失效(40100)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/days/{id}:
    get:
      tags: [days]
      operationId: getDay
      summary: 日子详情(PRIVATE 记录仅创建人可见,对他人等价不存在)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 日子详情(含当前用户视角 reminders)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DayRecord'
        '401':
          description: 未登录或身份失效(40100)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 日子不存在、PRIVATE 对家人不可见、越权访问(40400,不泄露存在性)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags: [days]
      operationId: updateDay
      summary: 编辑日子(创建人;FAMILY 可见记录户主亦可编辑;全量覆盖式;reminders 不经此端点,走 /api/days/{id}/reminder)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DayUpsertRequest'
      responses:
        '200':
          description: 已更新的日子记录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DayRecord'
        '400':
          description: 参数错误(40000)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未登录或身份失效(40100)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 日子不存在或无权编辑(40400,不泄露存在性)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [days]
      operationId: deleteDay
      summary: 删除日子及当前用户的提醒配置(权限同 PUT;前端删除前需二次确认)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 删除结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteDayResponse'
        '401':
          description: 未登录或身份失效(40100)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 日子不存在或无权删除(40400,不泄露存在性)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/days/{id}/reminder:
    put:
      tags: [days]
      operationId: updateDayReminder
      summary: 设置当前用户对该日子的提醒时点(幂等覆盖,空数组=关闭,默认关闭;沿用生日簿 /api/birthdays/{id}/reminder 模型,FAMILY 记录每位家人各自配置)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DayReminderRequest'
      responses:
        '200':
          description: 当前用户的提醒设置
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DayReminder'
        '400':
          description: 参数错误(40000:重复值/越界值/超 3 项)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未登录或身份失效(40100)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 日子不存在或对当前用户不可见(40400,不泄露存在性)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/days/reminder-due:
    get:
      tags: [days]
      operationId: getReminderDue
      summary: 到期计算(给定日期应提醒清单,命中用户配置提前量的日子;服务端调度与联调自测用,小程序端不调用;发送频控 ≤3 条/人/天在此结果上计算)
      parameters:
        - name: date
          in: query
          required: false
          schema:
            type: string
