      responses:
        '200':
          description: 只读月历数据(shifts 按 date 升序;ownerName 为分享者昵称,无昵称回退「家人」)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DutySharedCalendarResponse'
        '400':
          description: 参数错误(40000:month 非法)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: scene 无效或用户已注销(40400,不泄露存在性)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    LoginRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
          description: 微信登录凭证;开发态允许直接传 openid
    LoginResponse:
      type: object
      required: [token, userId, nickname]
      properties:
        token:
          type: string
        userId:
          type: integer
        nickname:
          type: string
        avatarUrl:
          type: string
    CreateFamilyRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: 家族名,1-10 字
    JoinFamilyRequest:
      type: object
      required: [inviteCode]
      properties:
        inviteCode:
          type: string
    TargetUserRequest:
      type: object
      required: [targetUserId]
      properties:
        targetUserId:
          type: integer
    PlateLevel:
      type: string
      enum: [NONE, BRONZE, SILVER, GOLD, JADE]
      description: 门牌等级:无/勤俭之家(500)/和睦之家(2000)/满门福气(5000)/福泽满堂(20000),只升不降
    FortuneLevel:
      type: string
      enum: [PINGAN, RUYI, HONGFU]
      description: 福签等级:平安(70%)/如意(25%)/鸿福(5%),纯稀有度玩法,不影响福值
    MemberStatus:
      type: object
      required: [userId, nickname, role, personalBless, streakDays, drawnToday]
      properties:
        userId:
          type: integer
        nickname:
          type: string
        avatarUrl:
          type: string
        remark:
          type: string
          description: 家庭称谓(儿子/孙子等),用户自选
        role:
          type: string
          enum: [OWNER, MEMBER]
        personalBless:
          type: integer
        streakDays:
          type: integer
          description: 连续接福天数
        drawnToday:
          type: boolean
        pendant:
          $ref: '#/components/schemas/Pendant'
    Pendant:
      type: string
      description: 头像挂件(达标解锁制,不消耗福值;佩戴持久化于用户档案,家人可见);解锁条件:竹叶=默认/火焰=连续接福7天/灯笼=个人福值≥200/锦鲤=个人福值≥1000/八卦=点亮4卦/福包=八卦圆满
      enum: [BAMBOO, FLAME, LANTERN, KOI, BAGUA, FUBAO]
    PendantWearRequest:
      type: object
      required: [pendant]
      properties:
        pendant:
          $ref: '#/components/schemas/Pendant'
    PendantWearResponse:
      type: object
      required: [pendant]
      properties:
        pendant:
          $ref: '#/components/schemas/Pendant'
    FamilyDetail:
      type: object
      required: [notJoined]
      properties:
        notJoined:
          type: boolean
          description: true=当前用户未加入任何家族
        familyId:
          type: integer
        familyName:
          type: string
        inviteCode:
          type: string
        totalBless:
          type: integer
          description: 家族福池累计值
        plateLevel:
          $ref: '#/components/schemas/PlateLevel'
        nextPlateBless:
          type: integer
          description: 距下一级门牌还差的福值
        members:
          type: array
          items:
            $ref: '#/components/schemas/MemberStatus'
    FortuneCard:
      type: object
      required: [familyId, date, level, yiItems, blessText, gua, cardTheme]
      properties:
        familyId:
          type: integer
        date:
          type: string
          description: 日期 yyyy-MM-dd
        level:
          $ref: '#/components/schemas/FortuneLevel'
        yiItems:
          type: array
          items:
            type: string
          description: 今日宜 2-3 项,生活化正面建议,永不出现忌
        blessText:
          type: string
          description: 祝福语,过合规词表
        gua:
          $ref: '#/components/schemas/Gua'
        cardTheme:
          type: string
          description: 卦位对应卡面主题(乾=云鹤/兑=锦鲤/离=灯笼/震=春雷/巽=风铃/坎=锦鲤戏水/艮=山景/坤=花开);只影响卡面,不影响等级/概率/福值
        festival:
          type: string
          nullable: true
          maxLength: 16
          description: 节日限定标记(如「新春」「中秋」),非节日日为 null
    FortuneTodayResponse:
      type: object
      required: [card, drawn, shared, taskDone]
      properties:
        card:
          $ref: '#/components/schemas/FortuneCard'
        drawn:
          type: boolean
        shared:
          type: boolean
        taskDone:
          type: boolean
        personalBless:
          type: integer
    FortuneDrawResponse:
      type: object
      required: [card, personalBless, familyTotalBless]
      properties:
        card:
          $ref: '#/components/schemas/FortuneCard'
        personalBless:
          type: integer
        familyTotalBless:
          type: integer
        praiseText:
          type: string
          description: 抽签吉祥话(如:坚持第N天,越活越年轻)
    BlessResult:
      type: object
      required: [amount, personalBless, familyTotalBless, plateLevel]
      properties:
        amount:
          type: integer
          description: 本次获得福值
        personalBless:
          type: integer
        familyTotalBless:
          type: integer
        plateLevel:
          $ref: '#/components/schemas/PlateLevel'
    CuifuResult:
      type: object
      required: [sent, remainCount]
      properties:
        sent:
          type: boolean
        remainCount:
          type: integer
          description: 今日对该家人剩余催福次数(0-3)
    FamilyRankItem:
      type: object
      required: [rank, userId, nickname, bless]
      properties:
        rank:
          type: integer
        userId:
          type: integer
        nickname:
          type: string
        bless:
          type: integer
          description: 本周攒福值
        streakDays:
          type: integer
    FamilyRankResponse:
      type: object
      required: [weekStart, items]
      properties:
        weekStart:
          type: string
          description: 本周起始日期 yyyy-MM-dd
        items:
          type: array
          items:
            $ref: '#/components/schemas/FamilyRankItem'
    FriendRankItem:
      type: object
      required: [rank, familyId, familyName, bless, isMine]
      properties:
        rank:
          type: integer
        familyId:
          type: integer
        familyName:
          type: string
        bless:
          type: integer
        plateLevel:
          $ref: '#/components/schemas/PlateLevel'
        isMine:
          type: boolean
    FriendRankResponse:
      type: object
      required: [items, chaseText]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/FriendRankItem'
        chaseText:
          type: string
          description: 追赶文案(如:就差60福值追上老李家,今天全家接福就能反超)
    InviteInfo:
      type: object
      required: [familyName, familyId, memberCount, inviteText]
      properties:
        familyName:
          type: string
        familyId:
          type: integer
        memberCount:
          type: integer
        inviteText:
          type: string
          description: 邀请文案,如:王家庄邀请您一起接福气,全家福值榜见!
    CalendarType:
      type: string
      enum: [SOLAR, LUNAR]
      description: 日期口径：公历或农历
    BirthdaySubjectType:
      type: string
      enum: [MEMBER, CONTACT]
      description: MEMBER 为家族成员，CONTACT 为亲友
    BirthdayVisibility:
      type: string
      enum: [PRIVATE, FAMILY]
      description: PRIVATE 仅录入人可见，FAMILY 家人可见
    CalendarConvertRequest:
      type: object
      required: [calendarType]
      properties:
        calendarType:
          $ref: '#/components/schemas/CalendarType'
        solarDate:
          type: string
          description: 完整公历日期 yyyy-MM-dd；只查不保存时使用，范围 1900-01-01 至当天
        month:
          type: integer
          description: 按日期口径填写的生日月份；与 day 一起用于计算下一次日期
        day:
          type: integer
          description: 按日期口径填写的生日日期；与 month 一起使用
        isLeapMonth:
          type: boolean
          default: false
          description: 仅农历有效，是否为闰月
    CalendarConvertResponse:
      type: object
      required: [solarDate, lunarText, lunarMonth, lunarDay, isLeapMonth]
      properties:
        solarDate:
          type: string
          description: 对应或下一次的公历日期 yyyy-MM-dd
        lunarText:
          type: string
          description: 农历显示文本，如农历八月十五
        lunarMonth:
          type: integer
        lunarDay:
          type: integer
        isLeapMonth:
          type: boolean
    BirthdayUpsertRequest:
      type: object
      required: [subjectType, displayName, calendarType, month, day, isLeapMonth, visibility]
      properties:
        subjectType:
          $ref: '#/components/schemas/BirthdaySubjectType'
        subjectUserId:
          type: integer
          nullable: true
          description: subjectType=MEMBER 时必填，且必须属于当前家族
        displayName:
          type: string
          minLength: 1
          maxLength: 12
          description: 家人的称呼或亲友姓名
        calendarType:
          $ref: '#/components/schemas/CalendarType'
        month:
          type: integer
        day:
          type: integer
        isLeapMonth:
          type: boolean
        visibility:
          $ref: '#/components/schemas/BirthdayVisibility'
    BirthdayReminderRequest:
      type: object
      required: [reminderDays]
      properties:
        reminderDays:
          type: array
          maxItems: 3
          uniqueItems: true
          items:
            type: integer
            enum: [7, 3, 0]
          description: 提前天数，空数组表示关闭提醒
    BirthdayReminder:
      type: object
      required: [birthdayId, reminderDays]
      properties:
        birthdayId:
          type: integer
        reminderDays:
          type: array
          items:
            type: integer
    BirthdayRecord:
      type: object
      required: [id, familyId, subjectType, displayName, calendarType, month, day, isLeapMonth, visibility, createdBy, nextBirthdayDate, nextBirthdayLunarText, reminderDays]
      properties:
        id:
          type: integer
        familyId:
          type: integer
        subjectType:
          $ref: '#/components/schemas/BirthdaySubjectType'
        subjectUserId:
          type: integer
          nullable: true
        displayName:
          type: string
        calendarType:
          $ref: '#/components/schemas/CalendarType'
        month:
          type: integer
        day:
          type: integer
        isLeapMonth:
          type: boolean
        visibility:
          $ref: '#/components/schemas/BirthdayVisibility'
        createdBy:
          type: integer
        nextBirthdayDate:
          type: string
          description: 下一次生日对应公历日期 yyyy-MM-dd
        nextBirthdayLunarText:
          type: string
          description: 下一次生日农历显示文本
        daysUntil:
          type: integer
          description: 距下一次生日的天数
        reminderDays:
          type: array
          items:
            type: integer
          description: 当前用户设置的提醒提前天数
    BirthdayListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/BirthdayRecord'
    UpcomingBirthdayResponse:
      type: object
      required: [upcoming]
      properties:
        upcoming:
          allOf:
            - $ref: '#/components/schemas/BirthdayRecord'
          nullable: true
    DeleteBirthdayResponse:
      type: object
      required: [deleted]
      properties:
        deleted:
          type: boolean
    Gua:
      type: string
      description: 八卦卦位;家族+日期唯一确定,全家同卦,每日变化;只影响卡面主题
      enum: [QIAN, DUI, LI, ZHEN, XUN, KAN, GEN, KUN]
    FortuneTaskDoneRequest:
      type: object
      properties:
        taskItem:
          type: string
          maxLength: 24
          description: 完成的今日宜事项文本(须属于当日卡面 yiItems;用于八卦阵早睡/喝水/打电话类进度统计;缺省时兼容旧行为)
    BaguaTrigramProgress:
      type: object
      required: [gua, lit, current, target, hint]
      properties:
        gua:
          $ref: '#/components/schemas/Gua'
        lit:
          type: boolean
          description: 是否已点亮;只涨不跌,永不熄灭
        current:
          type: integer
          description: 当前进度(服务端从事件/任务数据推导,≥0)
        target:
          type: integer
          description: 点亮阈值(>0)
        hint:
          type: string
          maxLength: 24
          description: 进度提示文案,过合规词表(禁卦象/卦运/吉位等)
    BaguaStatusResponse:
      type: object
      required: [trigrams, litCount, complete]
      properties:
        trigrams:
          type: array
          description: 8 卦进度(固定顺序:乾兑离震巽坎艮坤)
          items:
            $ref: '#/components/schemas/BaguaTrigramProgress'
        litCount:
          type: integer
          description: 已点亮卦数 0-8
        complete:
          type: boolean
          description: 八卦圆满(8 卦全亮)
        celebrated:
          type: boolean
          description: 圆满大阵图庆祝是否已触发(一次性,服务端标记防重复);未圆满时为 false
    BaguaCelebrateResponse:
      type: object
      required: [celebrated]
      properties:
        celebrated:
          type: boolean
          description: true=本次标记成功或此前已标记(幂等)
    JieyouQuoteType:
      type: string
      description: 宽心话三型:促成(推一把)/缓行(等一等)/放下(松一松)
      enum: [CU_CHENG, HUAN_XING, FANG_XIA]
    JieyouQuoteResponse:
      type: object
      required: [quoteId, type, text, pageNo]
      properties:
        quoteId:
          type: integer
        type:
          $ref: '#/components/schemas/JieyouQuoteType'
        text:
          type: string
          maxLength: 16
          description: 宽心话正文,≤16 字,指向行动,禁吉凶与承诺结果词汇
        pageNo:
          type: integer
          description: 册页码(1-120,前端展示用)
    NotifySubscribeRequest:
      type: object
      required: [templateId, accepted]
      properties:
        templateId:
          type: string
          description: 订阅消息模板 ID(微信后台申请;开发期占位联调)
        accepted:
          type: boolean
          description: 本次授权是否接受(拒绝也登记,用于频率透明展示)
    NotifySubscribeResponse:
      type: object
      required: [registered, remainingQuotaToday]
      properties:
        registered:
          type: boolean
        remainingQuotaToday:
          type: integer
          description: 今日剩余可发送条数(频控≤4 条/人/天)
    NotifyStatusResponse:
      type: object
      required: [subscribed, remainingQuotaToday, dailyLimit]
      properties:
        subscribed:
          type: boolean
          description: 是否存在有效授权额度
        remainingQuotaToday:
          type: integer
        dailyLimit:
          type: integer
          description: 每日上限(4);设置页展示「您每天最多收到 4 条提醒,不会多打扰」
    DayKind:
      type: string
      enum: [BIRTHDAY, ANNIVERSARY, TOGETHER]
      description: 日子类型:BIRTHDAY 生日/ANNIVERSARY 纪念日/TOGETHER 在一起(记起始日,展示累计天数)
    DayVisibility:
      type: string
      enum: [FAMILY, PRIVATE]
      description: FAMILY 家人可见(默认;未加入家族的用户传 FAMILY 被服务端降级为 PRIVATE),PRIVATE 仅创建人可见
    DayUpsertRequest:
      type: object
      required: [relation, kind, calendarType, visibility]
      properties:
        relation:
          type: string
          minLength: 1
          maxLength: 12
          description: 关系文本(妈妈/老伴/我自己/自定义),1-12 字
        emoji:
          type: string
          description: 1 个表情;缺省由服务端按 relation 预置映射(妈妈=👩 等),自定义关系默认 😊
        kind:
          $ref: '#/components/schemas/DayKind'
        calendarType:
          $ref: '#/components/schemas/CalendarType'
        month:
          type: integer
          description: 1-12;kind≠TOGETHER 时必填,TOGETHER 可省(服务端取创建当天为起始日)
        day:
          type: integer
          description: 1-31,按日历口径校验;kind≠TOGETHER 时必填,TOGETHER 可省
        visibility:
          $ref: '#/components/schemas/DayVisibility'
        year:
          type: integer
          nullable: true
          description: 可选,1900..当年,越界 40000;创建可填、编辑可补(全量覆盖);kind=ANNIVERSARY=称谓计算基数;kind=TOGETHER=补录起始年(提供时起始完整日期=year+month/day,togetherDays 随之,缺省仍 createdAt 年兼容既有数据);kind=BIRTHDAY=仅存档不输出任何年龄派生字段(隐私红线);缺省 null
        reminders:
          type: array
          maxItems: 3
          uniqueItems: true
          items:
            type: integer
            enum: [7, 3, 0]
          description: 创建人初始提醒配置,⊆{7,3,0} 去重 ≤3 项,缺省空数组(关闭);仅创建(POST)生效,PUT 忽略此字段(改提醒走 /api/days/{id}/reminder)
    DayRecord:
      type: object
      required: [id, userId, relation, emoji, kind, calendarType, month, day, visibility, reminders, createdAt, nextDate, nextDateLunarText, daysUntil, togetherDays, year, anniversaryNumber, anniversaryTitle, anniversaryLabel]
      properties:
        id:
          type: integer
        userId:
          type: integer
          description: 创建人;家族归属由用户唯一家族推导(每人限 1 家族)
        relation:
          type: string
          description: 关系文本,1-12 字
        emoji:
          type: string
          description: 1 个表情;缺省由 relation 预置映射
        kind:
          $ref: '#/components/schemas/DayKind'
        calendarType:
          $ref: '#/components/schemas/CalendarType'
          description: TOGETHER 固定 SOLAR;不含 isLeapMonth(农历落点按月日数值匹配,沿用生日簿算法,服务端职责)
        month:
          type: integer
          description: 1-12;TOGETHER 冗余存起始日当月
        day:
          type: integer
          description: 1-31 按日历口径;TOGETHER 冗余存起始日当日
        visibility:
          $ref: '#/components/schemas/DayVisibility'
        reminders:
          type: array
          items:
            type: integer
            enum: [7, 3, 0]
          description: 当前用户视角的提醒提前天数,⊆{7,3,0},空数组=关闭;底层为 day_reminder 表
        createdAt:
          type: string
          description: 创建时间 ISO 8601;TOGETHER 的完整起始日期=createdAt 年+month/day
        nextDate:
          type: string
          nullable: true
          description: 下次落点公历日期 yyyy-MM-dd(农历按月日数值匹配,服务端换算);TOGETHER 为 null
        nextDateLunarText:
          type: string
          nullable: true
          description: 下次落点农历显示文本(如 农历八月十五);TOGETHER 为 null
        daysUntil:
          type: integer
          nullable: true
          description: 距下次落点天数,≥0,0=就是今天;TOGETHER 为 null
        togetherDays:
          type: integer
          nullable: true
          description: 仅 TOGETHER:今天-起始日(下限 1),每天自动 +1;其余 kind 为 null;提供 year 时改按 year+month/day 起算(缺省仍 createdAt 年,兼容既有数据)
        year:
          type: integer
          nullable: true
          description: 可空;存档年份(1900..当年)。ANNIVERSARY=称谓计算基数;TOGETHER=补录起始年;BIRTHDAY=仅存档,响应不输出任何年龄派生字段(隐私红线);可反复修改(PUT 全量覆盖),改后周年字段即时重算;既有无 year 数据完全兼容
        anniversaryNumber:
          type: integer
          nullable: true
          description: 计算字段:仅 kind=ANNIVERSARY 且 year 非空时=N(nextDate 公历年−year,公农历落点换算后取公历年);其余恒 null
        anniversaryTitle:
          type: string
          nullable: true
          description: 计算字段:仅 ANNIVERSARY 且 N 命中服务端称谓库时输出(如 40=红宝石婚);未收录年份与其余 kind 恒 null(前端只显 label)
        anniversaryLabel:
          type: string
          nullable: true
          description: 计算字段:仅 ANNIVERSARY 且 year 非空时为「N 周年」文本;详情页与倒计时标签(「距 N 周年还有 X 天」由前端组合 daysUntil);其余 kind 恒 null
    DayListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          description: 已排序:非 TOGETHER 按 daysUntil 升序,TOGETHER 固定底部;空数组触发前端空状态
          items:
            $ref: '#/components/schemas/DayRecord'
    DayReminderRequest:
      type: object
      required: [reminders]
      properties:
        reminders:
          type: array
          maxItems: 3
          uniqueItems: true
          items:
            type: integer
            enum: [7, 3, 0]
          description: 提前天数,⊆{7,3,0} 去重 ≤3 项;空数组表示关闭提醒;重复值/越界值/超 3 项返回 40000
    DayReminder:
      type: object
      required: [dayId, reminders]
      properties:
        dayId:
          type: integer
        reminders:
          type: array
          items:
            type: integer
            enum: [7, 3, 0]
          description: 回显当前用户配置
    DayReminderDueItem:
      type: object
      required: [dayId, userId, remindOffset, title, actionText, kind, relation, daysTo, daysSince]
      properties:
        dayId:
          type: integer
        userId:
          type: integer
          description: 提醒接收人=配置人;服务端调度与联调自测用
        remindOffset:
          type: integer
          enum: [7, 3, 0]
          description: 命中的提前天数(0=当天)
        title:
          type: string
          description: 展示标题(如:妈妈的生日),过合规词表
        actionText:
          type: string
          maxLength: 24
          description: 行动建议文案(如:打个电话说声生日快乐),过合规词表
        kind:
          $ref: '#/components/schemas/DayKind'
        relation:
          type: string
          description: 关系文本,横幅展示用
        daysTo:
          type: integer
          nullable: true
          description: 距下次落点天数(0=今天);TOGETHER 为 null;横幅「今天有什么日子」用
        daysSince:
          type: integer
          nullable: true
          description: 仅 TOGETHER:在一起累计天数;其余为 null
    DayReminderDueResponse:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DayReminderDueItem'
        total:
          type: integer
          description: 应提醒总条数;发送频控 ≤3 条/人/天在此结果上计算
    DeleteDayResponse:
      type: object
      required: [deleted]
      properties:
        deleted:
          type: boolean
          description: 恒 true(不存在/越权返回 40400)
    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: 业务错误码(字符串形式,与运行时序列化一致):"40000" 参数错误(imageBase64 超限/非法 mime、photoId 非本人或 scene 不符或已绑定、瞬间 text 超长或违禁、收藏目标非 BIRTHDAY、momentIds 不在素材池、blessingText 违禁、year 越界等)/"40100" 未登录或身份失效(免鉴权 /api/visitor/* 与 /api/photos/{photoId} 端点组不适用)/"40300" 硬频控超限(提醒发送 >3 条/人/天,仅真实下发链路;感恩信生成每日每人 >5 次,AI 与降级路径统一计数;瞬间发布每日每人 >10 条;照片上传每日每人 >20 张)/"40400" 不存在或越权(不泄露存在性)/"40900" 状态冲突(胶囊未到期开箱、访客未解锁取隐藏内容、未加入家族发瞬间、)/"42900" 软频控——访客点亮心过于频繁(单设备对单卡片 >3 次/分钟),提示稍后再点,不阻断解锁目标
        message:
          type: string
          description: 面向用户的错误文案,须过合规词表
    TemplateKey:
      type: string
      enum: [LETTER, DAYS_CARD, CAPSULE, BIRTHDAY_CARD, HARD_FOR_DAD, WEDDING_CARD]
      description: 模板键(服务端配置主键):感恩信/相伴天数卡/时光胶囊邀请函/生日福卡/给爸爸的一句硬话/结婚纪念日卡;生日福卡随时可经 POST /api/cards 生成(无独立制作页,生日当天由提醒/横幅自然触达);后两者为预告态(live=false,预约展示)
    TemplateCategory:
      type: string
      enum: [FESTIVAL, FAMILY, COUPLE, FUN]
      description: 模板分类(前端分类 Tab 过滤):FESTIVAL 节日/FAMILY 家人/COUPLE 情侣/FUN 整活
    TemplatePreviewMeta:
      type: object
      required: [kicker, emoji, sampleText, backgroundKey, sub, feats, usedLabel, durationLabel, freeLabel, hint]
      properties:
        kicker:
          type: string
          description: 预览弹层眉题(如:写给妈妈)
        emoji:
          type: string
          description: 模板主表情
        sampleText:
          type: string
          description: 示例文案摘录,过合规词表
        backgroundKey:
          type: string
          description: 样式渲染键(前端据此选背景样式)
        sub:
          type: string
          description: 一句话说明
        feats:
          type: array
          items:
            type: string
          description: 特性标签数组
        usedLabel:
          type: string
          description: 社会证明文案(如:12.4 万人已写)
        durationLabel:
          type: string
          description: 耗时提示(如:约 3 分钟)
        freeLabel:
          type: string
          description: 免费标记,恒「✅ 免费」
        hint:
          type: string
          description: 场景化提示文案
    TemplateInfo:
      type: object
      required: [key, name, category, live, sort, previewMeta]
      properties:
        key:
          $ref: '#/components/schemas/TemplateKey'
        name:
          type: string
          description: 模板名(给妈妈的感恩信/相伴天数卡/时光胶囊邀请函/生日福卡/给爸爸的一句硬话/结婚纪念日卡)
        category:
          $ref: '#/components/schemas/TemplateCategory'
        live:
          type: boolean
          description: 上下架;false=预约态(主按钮「上线提醒我」,v1.8 起预约为服务端登记:/api/festivals/reservations,取消走 DELETE;不再前端本地收藏)
        sort:
          type: integer
          description: 展示序,升序
        festivalDate:
          type: string
          nullable: true
          description: 节点日期 yyyy-MM-dd,可空;节点日历横滑倒计时数据源(母亲节/父亲节/七夕),前端本地算 X 天后
        festivalLabel:
          type: string
          nullable: true
          description: 节点卡名称+emoji(如:母亲节 🌷),可空
        previewMeta:
          $ref: '#/components/schemas/TemplatePreviewMeta'
        makerPage:
          type: string
          nullable: true
          description: 制作页路径,可空(live 但无制作页的模板为 null,按钮提示「生日当天首页提醒你」)
    TemplateListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          description: 按 sort 升序;含 live=false 预约态模板;空数组触发前端空状态
          items:
            $ref: '#/components/schemas/TemplateInfo'
    StoryKey:
      type: string
      enum: ["她总给我留饭", "送我上学那些年", "她爱唠叨但都是好意", "她一个人把我带大", "我离家后她学会视频"]
      description: 感恩信 5 个固定素材键(值与交互原型 STORY_PARAS 键一致);stories 值域即此枚举
    LetterTone:
      type: string
      enum: [TEAR, FUN, CALM]
      description: 信件语气:TEAR 戳泪点/FUN 幽默/CALM 平淡
    LetterSource:
      type: string
      enum: [AI, FALLBACK]
      description: 生成来源:AI 优先;无 Key/异常静默降级本地文案库(FALLBACK)。降级对用户无感,仅埋点用
    LetterSegmentRole:
      type: string
      enum: [OPENING, STORY, CLOSING]
      description: 段落角色:OPENING 开头/STORY 故事段/CLOSING 收尾段
    LetterGenerateRequest:
      type: object
      required: [recipient, stories, tone]
      properties:
        recipient:
          type: string
          minLength: 1
          maxLength: 12
          description: 收信人(妈妈/岳母/婆婆/奶奶/自定义文本),1-12 字
        stories:
          type: array
          minItems: 1
          maxItems: 5
          uniqueItems: true
          items:
            $ref: '#/components/schemas/StoryKey'
          description: 故事素材多选,1-5 项去重;值域=5 个固定素材键;空数组返回 40000
        tone:
          $ref: '#/components/schemas/LetterTone'
    LetterSegment:
      type: object
      required: [index, role, variants, selected]
      properties:
        index:
          type: integer
          description: 段序(响应数组下标,顺序即信件顺序)
        role:
          $ref: '#/components/schemas/LetterSegmentRole'
        storyKey:
          allOf:
            - $ref: '#/components/schemas/StoryKey'
          nullable: true
          description: 仅 role=STORY 段有值,对应请求 stories 项;OPENING/CLOSING 为 null
        variants:
          type: array
          minItems: 2
          items:
            type: string
          description: 本段备选写法 ≥2 项(前端「逐句点换」的数据基础,同段循环点换);每条均过违禁词表
        selected:
          type: string
          description: 当前采用写法(默认=variants 之一;前端点换后仅本地态变化,定稿时写入 POST /api/cards)
    LetterGenerateResponse:
      type: object
      required: [generationId, source, paragraphs, signText]
      properties:
        generationId:
          type: string
          description: 本次生成标识(幂等用途;前端定稿时随 payload 记录来源,服务端不存草稿)
        source:
          $ref: '#/components/schemas/LetterSource'
        paragraphs:
          type: array
          minItems: 5
          maxItems: 9
          items:
            $ref: '#/components/schemas/LetterSegment'
          description: 5-9 段,顺序=开头 1+每故事 1+收尾 1;AI 输出逐段过违禁词表,命中即丢弃并以降级写法补位
        signText:
          type: string
          description: 落款固定文案(如:—— 你的孩子),不可换
    CardKind:
      type: string
      enum: [LETTER, DAYS_CARD, CAPSULE, BIRTHDAY_CARD]
      description: 卡片类型(可制作的四类):LETTER 感恩信/DAYS_CARD 相伴天数卡/CAPSULE 时光胶囊邀请函/BIRTHDAY_CARD 生日福卡(v1.8 新增,随时可生成,收藏瞬间照片做封面)
    CardStatus:
      type: string
      enum: [ACTIVE, DELETED]
      description: 卡片状态:ACTIVE 正常(默认)/DELETED 软删(列表/详情/访客端均不可见)
    CardPayload:
      type: object
      description: 按 templateKind 异构的卡片定稿内容(服务端按 kind 校验结构与长度,非法 40000)。LETTER 必填 recipient/tone/paragraphs/signText/styleKey(恒 NIGHT);DAYS_CARD 必填 relation/startDate/styleKey(SUNSET|NIGHT|MINT);CAPSULE 必填 capsuleId/coverHint/openDate/type/styleKey(恒 MINT);BIRTHDAY_CARD 必填 dayId/relation/blessingText/momentIds/styleKey(WARM|MINT)。未适用的字段不出现
      properties:
        recipient:
          type: string
          description: 仅 LETTER:收信人,1-12 字
        tone:
          $ref: '#/components/schemas/LetterTone'
        paragraphs:
          type: array
          items:
            type: string
          description: 仅 LETTER:定稿段落(每段为选定写法纯文本)
        signText:
          type: string
          description: 仅 LETTER:落款固定文案
        relation:
          type: string
          description: 仅 DAYS_CARD 与 BIRTHDAY_CARD:关系文本,1-12 字;BIRTHDAY_CARD 取自 dayId 对应 DayRecord
        startDate:
          type: string
          description: 仅 DAYS_CARD:起始日 yyyy-MM-dd(含年;独立输入或来自关联日子)
        styleKey:
          type: string
          enum: [SUNSET, NIGHT, MINT, WARM]
          description: 样式渲染键;LETTER 恒 NIGHT,DAYS_CARD 三选一,CAPSULE 恒 MINT,BIRTHDAY_CARD 二选一(WARM 霞橘|MINT 青金)
        capsuleId:
          type: integer
          description: 仅 CAPSULE:关联 TimeCapsule id(引用非包含)
        coverHint:
          type: string
          description: 仅 CAPSULE:封面提示语 1-40 字
        openDate:
          type: string
          description: 仅 CAPSULE:开箱日 yyyy-MM-dd
        type:
          type: string
          enum: [SELF, PARTNER]
          description: 仅 CAPSULE:给未来的自己/给未来的 TA
        dayId:
          type: integer
          description: 仅 BIRTHDAY_CARD:关联 DayRecord id(须 kind=BIRTHDAY 且本人可见,否则 40000;随时可生成,生日当天由提醒自然触达)
        blessingText:
          type: string
          minLength: 1
          maxLength: 40
          description: 仅 BIRTHDAY_CARD:祝福语 1-40 字;过违禁词表,命中 40000
        momentIds:
          type: array
          minItems: 1
          maxItems: 3
          uniqueItems: true
          items:
            type: integer
          description: 仅 BIRTHDAY_CARD:选中的瞬间 id 1-3 项;生成时均须在该 dayId 收藏素材池中,否则 40000;素材瞬间后续被删不影响已存档 payload(访客端解析时跳过失效素材)
    CreateCardRequest:
      type: object
      required: [templateKind, payload]
      properties:
        templateKind:
          $ref: '#/components/schemas/CardKind'
        payload:
          $ref: '#/components/schemas/CardPayload'
        sourceDayId:
          type: integer
          nullable: true
          description: 仅 DAYS_CARD 可关联 DayRecord(kind=TOGETHER);传入非本人/非 TOGETHER 日子 40000;缺省=独立输入起始日
        capsuleId:
          type: integer
          nullable: true
          description: 仅 CAPSULE 必填,须为本人 SEALED 胶囊;非本人或非 SEALED 40000/40400
    MadeCard:
      type: object
      required: [id, templateKind, payload, status, createdAt, totalHearts]
      properties:
        id:
          type: integer
        templateKind:
          $ref: '#/components/schemas/CardKind'
        payload:
          $ref: '#/components/schemas/CardPayload'
        sourceDayId:
          type: integer
          nullable: true
          description: 仅 DAYS_CARD:关联 DayRecord id;独立输入起始日时为 null
        capsuleId:
          type: integer
          nullable: true
          description: 仅 CAPSULE:关联 TimeCapsule id
        shareScene:
          type: string
          nullable: true
          description: 分享场景码(8-12 位 base62,卡片维度唯一);首次 POST /api/cards/{id}/share 时签发,后续恒定;软删后该 scene 访客端 40400;未签发为 null
        status:
          $ref: '#/components/schemas/CardStatus'
        createdAt:
          type: string
          description: 创建时间 ISO 8601;列表按此降序
        totalHearts:
          type: integer
          description: 收到的心:该卡片全部访客设备 VisitorUnlock hearts 之和(跨设备累计);我的页「收到的心」=各卡合计
    MadeCardListResponse:
      type: object
      required: [items, total, heartsReceived]
      properties:
        items:
          type: array
          description: 仅 status=ACTIVE,按 createdAt 降序;封面渲染元数据从 payload 归并;空数组触发前端空状态
          items:
            $ref: '#/components/schemas/MadeCard'
        total:
          type: integer
          description: 做过的卡片数(我的页统计)
        heartsReceived:
          type: integer
          description: 收到的心=本人全部卡片 totalHearts 之和(我的页统计)
    DeleteCardResponse:
      type: object
      required: [deleted]
      properties:
        deleted:
          type: boolean
          description: 恒 true(不存在/越权/已删返回 40400 或幂等 true;软删幂等)
    ShareSceneResponse:
      type: object
      required: [scene, pagePath]
      properties:
        scene:
          type: string
          minLength: 8
          maxLength: 12
          description: 场景码(8-12 位 base62 高熵随机串,卡片维度唯一);幂等:首次调用生成,后续恒定;卡片软删后失效(访客端 40400)
        pagePath:
          type: string
          maxLength: 40
          description: 访客落地页路径(pages/visitor/visitor?scene=XXXXXXXX,pagePath 前缀 28 字符+scene 8-12 位,总长 ≤40);前端据此本地绘二维码/海报
    CapsuleType:
      type: string
      enum: [SELF, PARTNER]
      description: 胶囊类型:SELF 给未来的自己/PARTNER 给未来的 TA
    CapsuleOpenRule:
      type: string
      enum: [ONE_YEAR_LATER, GAOKAO_SCORE_DAY, WEDDING_ANNIVERSARY, BABY_18]
      description: 开箱规则预设(仅展示用,开箱判定唯一看 openDate):一年后/高考出分日/结婚纪念日/孩子 18 岁
    CapsuleStatus:
      type: string
      enum: [SEALED, OPENED]
      description: 胶囊状态:SEALED 封存(内容门控:任何端点不下发 contentText/photoUrl)/OPENED 已开箱(内容对本人常开)
    CapsuleCreateRequest:
      type: object
      required: [type, openRule, coverHint, contentText]
      properties:
        type:
          $ref: '#/components/schemas/CapsuleType'
        openRule:
          $ref: '#/components/schemas/CapsuleOpenRule'
        openDate:
          type: string
          nullable: true
          description: 开箱日 yyyy-MM-dd,唯一权威开箱判定字段;ONE_YEAR_LATER 由服务端按封存日+365 天计算可缺省,其余预设必填;必须>今天,否则 40000
        coverHint:
          type: string
          minLength: 1
          maxLength: 40
          description: 封面提示语 1-40 字(预置点选或自定义),开箱人扫码第一眼所见;过违禁词表
        contentText:
          type: string
          minLength: 1
          maxLength: 500
          description: 信件内容 1-500 字,明文存、读取由接口门控;过违禁词表(静态+运行时)
        photoId:
          type: string
          nullable: true
          description: 可空;v1.8 新增,须为本人上传且 scene=CAPSULE 的未绑定照片(ORPHAN),否则 40000;传入则优先于 photoUrl 直传旧形态(保留兜底兼容存量);绑定后照片置 ACTIVE
        photoUrl:
          type: string
          nullable: true
          description: 可空;photoId 直传旧形态,允许为空串或前端自托管链接;门控同 contentText;photoId 存在时读侧此计算字段恒为 /api/photos/{photoId}
    TimeCapsule:
      type: object
      required: [id, type, openRule, openDate, coverHint, status, sealedAt, daysUntilOpen, dueNow, photoId]
      properties:
        id:
          type: integer
        type:
          $ref: '#/components/schemas/CapsuleType'
        openRule:
          $ref: '#/components/schemas/CapsuleOpenRule'
        openDate:
          type: string
          description: 开箱日 yyyy-MM-dd(唯一权威开箱判定字段)
        coverHint:
          type: string
          description: 封面提示语,开箱人扫码第一眼所见;SEALED 态访客亦可见
        contentText:
          type: string
          nullable: true
          description: 信件内容(内容门控:status=SEALED 时任何端点不下发此字段,status=OPENED 时返回)
        photoId:
          type: string
          nullable: true
          description: 关联照片 id(门控同 contentText);封存时未传为 null;胶囊删除联动照片置 DELETED(回图 40400)
        photoUrl:
          type: string
          nullable: true
          description: 照片链接(门控同 contentText);可空;photoId 存在时恒为 /api/photos/{photoId},否则为封存时 photoUrl 直传旧值
        status:
          $ref: '#/components/schemas/CapsuleStatus'
        sealedAt:
          type: string
          description: 封存时间 ISO 8601;ONE_YEAR_LATER 的 openDate=sealedAt+365 天
        openedAt:
          type: string
          nullable: true
          description: 首次 POST /api/capsules/{id}/open 时间;SEALED 态为 null
        daysUntilOpen:
          type: integer
          description: 今天到 openDate 的天数,≥0;=0 即到期可开(dueNow)
        dueNow:
          type: boolean
          description: today≥openDate 且 status=SEALED;首页召回横幅数据源
    CapsuleListResponse:
      type: object
      required: [items, dueCount]
      properties:
        items:
          type: array
          description: 按 openDate 升序,已开的按 openedAt 降序排后;SEALED 态项不含内容字段
          items:
            $ref: '#/components/schemas/TimeCapsule'
        dueCount:
          type: integer
          description: 待开数(我的页「待开红点」角标)
    CapsuleOpenResponse:
      type: object
      required: [id, type, openRule, openDate, coverHint, contentText, photoUrl, status, sealedAt, openedAt, daysUntilOpen]
      properties:
        id:
          type: integer
        type:
          $ref: '#/components/schemas/CapsuleType'
        openRule:
          $ref: '#/components/schemas/CapsuleOpenRule'
        openDate:
          type: string
          description: 开箱日 yyyy-MM-dd
        coverHint:
          type: string
        contentText:
          type: string
          description: 信件本体(开箱揭示;重复调用幂等返回首次结果)
        photoId:
          type: string
          nullable: true
          description: 关联照片 id(封存时未传为 null)
        photoUrl:
          type: string
          nullable: true
          description: 照片链接(封存时未传为 null;photoId 存在时恒为 /api/photos/{photoId})
        status:
          type: string
          enum: [OPENED]
          description: 恒 OPENED
        sealedAt:
          type: string
        openedAt:
          type: string
          description: 首次开箱时间(幂等返回首次结果)
        daysUntilOpen:
          type: integer
          description: 开箱后为 0
    HeartsRequest:
      type: object
      required: [deviceId]
      properties:
        deviceId:
          type: string
          minLength: 32
          maxLength: 64
          description: 前端生成并持久化的 UUID,32-64 字符;与 VisitorUnlock.deviceId 对应(同设备同卡片唯一约束)
    VisitorCardView:
      type: object
      required: [templateKind, publicPayload, lockedTeaser, hearts, unlocked]
      properties:
        templateKind:
          $ref: '#/components/schemas/CardKind'
        publicPayload:
          $ref: '#/components/schemas/VisitorPublicPayload'
        lockedTeaser:
          type: string
          description: 打码钩子提示文案(如:还有一段 TA 没发出来的话),前端渲染渐隐遮罩;过违禁词表
        hearts:
          type: integer
          description: 本设备已点亮数 0-3
        unlocked:
          type: boolean
          description: hearts≥3 即 true;true 时前端展示深色转化 CTA
    VisitorPublicPayload:
      type: object
      description: 体面内容(按卡片可见策略脱敏,按 templateKind 异构)。LETTER=recipient+前 3 段+落款;DAYS_CARD=relation/startDate/daysTogether/styleKey;CAPSULE=type/coverHint/openDate/daysUntilOpen(不含信件本体);BIRTHDAY_CARD=relation/photoUrls(≤3,capability 路径)/kicker(恒「生日快乐」)。未适用的字段不出现
      properties:
        recipient:
          type: string
          description: 仅 LETTER:收信人
        paragraphs:
          type: array
          maxItems: 3
          items:
            type: string
          description: 仅 LETTER:前 3 段定稿文本
        signText:
          type: string
          description: 仅 LETTER:落款
        relation:
          type: string
          description: 仅 DAYS_CARD 与 BIRTHDAY_CARD:关系文本
        startDate:
          type: string
          description: 仅 DAYS_CARD:起始日 yyyy-MM-dd
        daysTogether:
          type: integer
          description: 仅 DAYS_CARD:相伴天数(服务端实时按 startDate 计算,与本人 togetherDays 同源)
        styleKey:
          type: string
          description: 样式渲染键(访客页复用卡片样式)
        photoUrls:
          type: array
          maxItems: 3
          items:
            type: string
          description: 仅 BIRTHDAY_CARD:封面照片 capability 路径(≤3,取自 payload momentIds 对应瞬间;素材瞬间已删则该项跳过);<image> 直挂 /api/photos/{photoId}
        kicker:
          type: string
          description: 仅 BIRTHDAY_CARD:眉题,恒「生日快乐」
        type:
          $ref: '#/components/schemas/CapsuleType'
        coverHint:
          type: string
          description: 仅 CAPSULE:封面提示语
        openDate:
          type: string
          description: 仅 CAPSULE:开箱日 yyyy-MM-dd
        daysUntilOpen:
          type: integer
          description: 仅 CAPSULE:距开箱天数(服务端实时计算)
    VisitorUnlockState:
      type: object
      required: [hearts, unlocked, remainingHint, totalHearts]
      properties:
        hearts:
          type: integer
          description: 点亮后本设备计数 0-3;已满 3 后再调恒返回 3(幂等不报错)
        unlocked:
          type: boolean
          description: hearts≥3 即 true
        remainingHint:
          type: string
          description: 「还差 N 颗 ❤️」或「已解锁」;过违禁词表
        totalHearts:
          type: integer
          description: 该卡片累计收到的总心数(跨设备,与卡片主人 totalHearts 统计同源)
    UnlockedContentResponse:
      type: object
      required: [templateKind, hiddenContent, ctaCopy]
      properties:
        templateKind:
          $ref: '#/components/schemas/CardKind'
        hiddenContent:
          $ref: '#/components/schemas/HiddenContent'
        ctaCopy:
          $ref: '#/components/schemas/CtaCopy'
    HiddenContent:
      type: object
      description: 隐藏内容(按 templateKind 异构)。LETTER=paragraphs(完整定稿段落)+signText;DAYS_CARD=hiddenLine(如:下一个 N 天,打算继续赖着你);CAPSULE=contentText+photoUrl(开箱日前为预置悬念文案,不含真实内容;开箱日后为信件本体+照片);BIRTHDAY_CARD=blessingText(祝福语,体面内容=关系+照片,点亮 3 心解锁)。未适用的字段不出现
      properties:
        paragraphs:
          type: array
          items:
            type: string
          description: 仅 LETTER:完整定稿段落
        signText:
          type: string
          description: 仅 LETTER:落款
        hiddenLine:
          type: string
          description: 仅 DAYS_CARD:隐藏的一句话(服务端按 daysTogether 填充)
        blessingText:
          type: string
          description: 仅 BIRTHDAY_CARD:祝福语本体(体面内容=关系+封面照片,点亮 3 心解锁;钩子文案复用 lockedTeaser)
        contentText:
          type: string
          description: 仅 CAPSULE:开箱日前为预置悬念文案;开箱日后为信件本体
        photoUrl:
          type: string
          nullable: true
          description: 仅 CAPSULE:照片链接,开箱日前为 null;photoId 存在时恒为 /api/photos/{photoId}
    CtaCopy:
      type: object
      required: [title, sub, buttonText]
      properties:
        title:
          type: string
          description: 深色转化 CTA 标题(如:用「念家时」打开你们的照片)
        sub:
          type: string
          description: CTA 副标题(如:免费记日子·做卡片·埋时光胶囊)
        buttonText:
          type: string
          description: CTA 按钮文案(如:打开念家时)
    PhotoScene:
      type: string
      enum: [MOMENT, CAPSULE]
      description: 照片用途声明:上传时声明,绑定时校验一致性(不符 40000);MOMENT=家人瞬间封面,CAPSULE=时光胶囊附图
    PhotoMimeType:
      type: string
      enum: [image/jpeg, image/png, image/webp]
      description: 照片 mime;上传可缺省(按字节头嗅探,无法识别 40000);回图端点 Content-Type 同源
    PhotoUploadRequest:
      type: object
      required: [imageBase64, scene]
      properties:
        imageBase64:
          type: string
          description: base64 编码的图片字节;解码后 1..512000 字节(≤500KB),超限 40000;base64 JSON 请求体,注意网关层(callContainer)请求体上限约 1MB 或更小,联调确认
        scene:
          $ref: '#/components/schemas/PhotoScene'
        mimeType:
          allOf:
            - $ref: '#/components/schemas/PhotoMimeType'
          nullable: true
          description: 可缺省;缺省按字节头嗅探,无法识别 40000
    PhotoUploadResponse:
      type: object
      required: [photoId, photoUrl, sizeBytes]
      properties:
        photoId:
          type: string
          minLength: 16
          maxLength: 20
          description: 照片标识,16-20 位 base62 高熵随机串,全局唯一;即回图 capability URL 令牌,内容不可变(同 id 不复用)
        photoUrl:
          type: string
          description: 恒 /api/photos/{photoId} 相对路径(客户端拼域名使用;留 OSS 迁移空间,迁移只换实现不改契约)
        sizeBytes:
          type: integer
          description: 解码后字节数;回图响应 Content-Length 同源
    FestivalReservationRequest:
      type: object
      required: [templateKey]
      properties:
        templateKey:
          $ref: '#/components/schemas/TemplateKey'
    FestivalReservation:
      type: object
      required: [templateKey, reserved, reservedAt]
      properties:
        templateKey:
          $ref: '#/components/schemas/TemplateKey'
        reserved:
          type: boolean
          description: 恒 true(幂等语义:重复预约返回既有记录不报错)
        reservedAt:
          type: string
          description: 首次登记时间 ISO 8601(重复预约不变)
    ReservationListItem:
      type: object
      required: [templateKey, name, live, reservedAt]
      properties:
        templateKey:
          $ref: '#/components/schemas/TemplateKey'
        name:
          type: string
          description: 模板名(与 /api/templates 同源)
        live:
          type: boolean
          description: 模板上下架;false=上线提醒预约,true=节日提醒预约
        festivalLabel:
          type: string
          nullable: true
          description: 节点卡名称+emoji(如:母亲节 🌷);非节日模板为 null
        festivalDate:
          type: string
          nullable: true
          description: 节点日期 yyyy-MM-dd;非节日模板为 null
        daysUntil:
          type: integer
          nullable: true
          description: 按 festivalDate 计算的距今天数(0=今天);festivalDate 为 null 时为 null
        reservedAt:
          type: string
          description: 首次登记时间 ISO 8601;清单按此降序
    ReservationListResponse:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          description: 本人全部预约,按 reservedAt 降序;空数组触发前端空状态
          items:
            $ref: '#/components/schemas/ReservationListItem'
        total:
          type: integer
          description: 预约总数
    CancelReservationResponse:
      type: object
      required: [deleted]
      properties:
        deleted:
          type: boolean
          description: 恒 true(幂等:未预约再取消也成功)
    FestivalDueItem:
      type: object
      required: [templateKey, festivalLabel, festivalDate, daysUntil, live, reservedByMe, dueSoon]
      properties:
        templateKey:
          $ref: '#/components/schemas/TemplateKey'
        festivalLabel:
          type: string
          description: 节点卡名称+emoji(如:母亲节 🌷)
        emoji:
          type: string
          nullable: true
          description: 节日主表情;无则 null
        festivalDate:
          type: string
          description: 节点日期 yyyy-MM-dd(落在今天起 0-7 天窗口内)
        daysUntil:
          type: integer
          description: 距今天数 0-7;0=就是今天
        live:
          type: boolean
          description: 模板上下架
        reservedByMe:
          type: boolean
          description: 本人是否已预约该模板
        dueSoon:
          type: boolean
          description: 预约到期标记=reservedByMe 且 daysUntil≤3(预约到期真实推送属后续调度,本端点仅数据)
    FestivalDueResponse:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          description: 窗口内节日模板清单,按 daysUntil 升序;首页节日横幅与节点倒计时数据源
          items:
            $ref: '#/components/schemas/FestivalDueItem'
        total:
          type: integer
          description: 窗口内节日数
    MomentCreateRequest:
      type: object
      required: [photoId, text]
      properties:
        photoId:
          type: string
          description: 须为本人上传且 scene=MOMENT 且未绑定(ORPHAN);他人照片/已绑定/scene 不符 40000;创建即绑定(照片 ORPHAN→ACTIVE)
        text:
          type: string
          minLength: 1
          maxLength: 60
          description: 一句话 1-60 字;过违禁词表,命中 40000
    FamilyMomentView:
      type: object
      required: [id, userId, photoId, photoUrl, text, createdAt, likeCount, likedByMe, collectedCount, collectedByMeDayIds]
      properties:
        id:
          type: integer
          description: 瞬间 id;时间线 cursor 分页游标
        userId:
          type: integer
          description: 发布人(发布人昵称经 /api/family 成员列表解析)
        photoId:
          type: string
          description: 封面照片 id(scene=MOMENT)
        photoUrl:
          type: string
          description: 封面照片 capability 路径,恒 /api/photos/{photoId};<image> 直挂
        text:
          type: string
          description: 一句话正文
        createdAt:
          type: string
          description: 发布时间 ISO 8601;时间线倒序键
        likeCount:
          type: integer
          description: 该瞬间累计真好数
        likedByMe:
          type: boolean
          description: 当前用户是否已点真好
        collectedCount:
          type: integer
          description: 被收藏次数(跨家人累计)
        collectedByMeDayIds:
          type: array
          items:
            type: integer
          description: 当前用户已收藏该瞬间到的日子 id 列表(收藏按钮态;空数组=未收藏)
    MomentListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          description: 本家族全部成员的 ACTIVE 瞬间,createdAt 倒序;无家族用户返回空数组(不报错,展示空状态)
          items:
            $ref: '#/components/schemas/FamilyMomentView'
        nextCursor:
          type: integer
          nullable: true
          description: 还有更早记录时=下页游标(下页 beforeId),否则缺省
    MomentLikeResponse:
      type: object
      required: [likeCount, likedByMe]
      properties:
        likeCount:
          type: integer
          description: 该瞬间累计真好数(点亮或取消后的最新计数)
        likedByMe:
          type: boolean
          description: 当前用户点赞态;POST 恒 true、DELETE 恒 false(幂等)
    MomentCollectRequest:
      type: object
      required: [dayId]
      properties:
        dayId:
          type: integer
          description: 目标日子 id;须 kind=BIRTHDAY 且本人可见(本人创建或同家族 FAMILY),否则 40000/40400;momentId+dayId+userId 唯一(幂等)
    MomentCollectResponse:
      type: object
      required: [collectedCount, collectedByMe, dayId]
      properties:
        collectedCount:
          type: integer
          description: 该瞬间累计收藏数(跨家人累计;操作后的最新计数)
        collectedByMe:
          type: boolean
          description: 当前用户对该日子的收藏态;POST 恒 true、DELETE 恒 false(幂等)
        dayId:
          type: integer
          description: 回显目标日子 id
    DeleteMomentResponse:
      type: object
      required: [deleted]
      properties:
        deleted:
          type: boolean
          description: 恒 true(重复删除幂等);软删+联动照片置 DELETED(回图 40400)
    DayCollectedMomentItem:
      type: object
      required: [momentId, photoUrl, text, authorName, collectedBy, collectedAt]
      properties:
        momentId:
          type: integer
          description: 瞬间 id
        photoUrl:
          type: string
          description: 瞬间封面照片 capability 路径 /api/photos/{photoId}
        text:
          type: string
          description: 瞬间一句话正文
        authorName:
          type: string
          description: 瞬间发布人昵称
        collectedBy:
          type: string
          description: 收藏人昵称(共享素材语义:素材池含全家人收藏,不限收藏人)
        collectedAt:
          type: string
          description: 收藏时间 ISO 8601;素材池排序键(倒序)
    DayCollectedMomentsResponse:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          description: 该 BIRTHDAY 日子的收藏素材池(全家人收藏,按 collectedAt 倒序;瞬间被删则其素材项即时消失;空数组触发前端空状态)
          items:
            $ref: '#/components/schemas/DayCollectedMomentItem'
        total:
          type: integer
          description: 素材条数
    DutyShiftKind:
      type: string
      enum: [early, mid, night, rest]
      description: 班次:early 早班(08:00-17:00)/mid 中班(12:00-24:00)/night 夜班(20:00-次日08:00)/rest 休;日历内单字标签(早/中/夜/休)+配色(早=玫红#ff4d6d/中=橙#e8943a/夜=藏蓝#3d4a5c/休=灰#c8cdd3)
    DutyShiftView:
      type: object
      required: [date, shift, source]
      properties:
        date:
          type: string
          format: date
          description: 业务日期 yyyy-MM-dd
        shift:
          $ref: '#/components/schemas/DutyShiftKind'
        source:
          type: string
          description: 来源:manual 单日编辑 / rule:daily / rule:on1off1 / rule:on2off2 / rule:emnr / rule:weekday(批量排班写入;MVP 仅存档,撤销语义未开放)
    DutyShiftRequest:
      type: object
      required: [date, shift]
      properties:
        date:
          type: string
          format: date
          description: 目标日期 yyyy-MM-dd
        shift:
          $ref: '#/components/schemas/DutyShiftKind'
    DutyShiftClearResponse:
      type: object
      required: [date, cleared]
      properties:
        date:
          type: string
          format: date
          description: 回显目标日期
        cleared:
          type: boolean
          description: 恒 true(幂等:无排班再清除也成功)
    DutyShiftRangeClearResponse:
      type: object
      required: [from, to, clearedDays]
      properties:
        from:
          type: string
          format: date
          description: 回显起始日期(截断时为原值)
        to:
          type: string
          format: date
          description: 实际清除截止日(截断时=from+365 天)
        clearedDays:
          type: integer
          description: 实际删除的排班行数(幂等语义下可为 0;周一值班的段内含非周五排班也一并清除)
    DutyCalendarResponse:
      type: object
      required: [month, shifts, stats]
      properties:
        month:
          type: string
          pattern: '^\d{4}-\d{2}$'
          description: 回显目标月份 yyyy-MM
        shifts:
          type: array
          description: 该月有排班的日期列表(按 date 升序;空数组=整月无排班,日历空白引导批量排班)
          items:
            $ref: '#/components/schemas/DutyShiftView'
        stats:
          $ref: '#/components/schemas/DutyMonthStats'
    DutyMonthStats:
      type: object
      required: [early, mid, night, rest]
      properties:
        early:
          type: integer
          description: 当月早班天数
        mid:
          type: integer
          description: 当月中班天数
        night:
          type: integer
          description: 当月夜班天数
        rest:
          type: integer
          description: 当月休班天数
    DutyNextDuty:
      type: object
      required: [date, shift, daysUntil]
      properties:
        date:
          type: string
          format: date
          description: 下次值班日期 yyyy-MM-dd(从明天起 60 天内最近非休班次日)
        shift:
          $ref: '#/components/schemas/DutyShiftKind'
        daysUntil:
          type: integer
          minimum: 1
          description: 距今天数(≥1;今天不参与倒计时)
    DutyShareSceneResponse:
      type: object
      required: [scene, pagePath]
      properties:
        scene:
          type: string
          pattern: '^[0-9a-zA-Z]{8}$'
          description: 8 位 base62 分享场景码(幂等:同用户恒同码)
        pagePath:
          type: string
          description: 只读月历落地页路径(带 scene,如 /pages/duty-view/duty-view?scene=xxx;前端转发 path 直接使用)
    DutySharedCalendarResponse:
      type: object
      required: [month, ownerName, shifts, stats]
      properties:
        month:
          type: string
          pattern: '^\d{4}-\d{2}$'
          description: 回显目标月份 yyyy-MM
        ownerName:
          type: string
          description: 分享者昵称(隐私脱敏:无昵称回退「家人」;绝不含 userId/openid)
        shifts:
          type: array
          description: 该月有排班的日期列表(按 date 升序;近 12 个月外返回空数组)
          items:
            $ref: '#/components/schemas/DutyShiftView'
        stats:
          $ref: '#/components/schemas/DutyMonthStats'
    DutyRemindConfig:
      type: object
      required: [timing, enabled]
      properties:
        timing:
          $ref: '#/components/schemas/DutyRemindTiming'
        enabled:
          type: boolean
          description: 提醒意愿开关;关闭后状态卡显示「提醒未开启」弱引导
    DutyRemindTiming:
      type: string
      enum: [advance_1d, same_day_08, advance_2h]
      description: 提醒时机:advance_1d 提前 1 天 12:00(默认)/same_day_08 当天 08:00/advance_2h 提前 2 小时;夜班场景建议 advance_2h(前端在设置夜班时引导切换)
    DutyRemindConfigRequest:
      type: object
      required: [timing, enabled]
      properties:
        timing:
          $ref: '#/components/schemas/DutyRemindTiming'
        enabled:
          type: boolean
    DutyTodayResponse:
      type: object
      required: [date, todayShift, nextDuty, remind]
      properties:
        date:
          type: string
          format: date
          description: 今天 yyyy-MM-dd
        todayShift:
          allOf:
            - $ref: '#/components/schemas/DutyShiftKind'
          nullable: true
          description: 今日班次;null=今日无排班(状态卡「今日无排班」+主按钮引导批量排班)
        nextDuty:
          allOf:
            - $ref: '#/components/schemas/DutyNextDuty'
          nullable: true
          description: 下次值班;null=60 天内无值班安排(状态卡「近期暂无值班安排」)
        remind:
          $ref: '#/components/schemas/DutyRemindConfig'
    DutyRuleType:
      type: string
      enum: [daily, on1off1, on2off2, emnr, weekday]
      description: 周期规则预设:daily 每天早班[早]/on1off1 做一休一[早,休]/on2off2 做二休二[早,早,休,休]/emnr 早→中→夜→休四班三运转近似[早,中,夜,休]/weekday 每周五值班(星期五→早班,其余日不动)
    DutyRuleView:
      type: object
      required: [active, appliedDays]
      properties:
        ruleType:
          allOf:
            - $ref: '#/components/schemas/DutyRuleType'
          nullable: true
          description: 当前规则类型;无规则为 null
        startDate:
          type: string
          format: date
          nullable: true
          description: 应用开始日;无规则为 null
        endDate:
          type: string
          format: date
          nullable: true
          description: 实际应用截止日(截断后);无规则为 null
        active:
          type: boolean
          description: 有规则恒 true;无规则 false(弹层引导「从批量排班开始」)
        appliedDays:
          type: integer
          description: 最近一次应用填充天数存档(0=从未应用)
    DutyRuleApplyRequest:
      type: object
      required: [ruleType, startDate, endDate]
      properties:
        ruleType:
          $ref: '#/components/schemas/DutyRuleType'
        startDate:
          type: string
          format: date
          description: 应用开始日 yyyy-MM-dd(默认下月 1 号,前端默认值)
        endDate:
          type: string
          format: date
          description: 应用截止日 yyyy-MM-dd(默认下月月末);早于 startDate 40000;跨度 >365 天服务端截断至 startDate+364 天
    DutyRuleApplyResponse:
      type: object
      required: [ruleType, startDate, endDate, appliedDays, truncated]
      properties:
        ruleType:
          $ref: '#/components/schemas/DutyRuleType'
        startDate:
          type: string
          format: date
          description: 回显开始日(截断时为原值)
        endDate:
          type: string
          format: date
          description: 实际应用截止日(截断时=startDate+364 天)
        appliedDays:
          type: integer
          description: 实际填充天数(weekday 类只数命中星期五的日期)
        truncated:
          type: boolean
          description: true=原跨度超 365 天已截断,前端 Toast 提示
